<!doctype html>
<!-- `dark` y `color-scheme` van en el HTML servido, no solo en mode-watcher: así
     el primer píxel ya es oscuro, antes de que corra cualquier script. Sin esto
     hay un destello claro en la carga. El sitio es oscuro siempre; no hay
     conmutador de tema en la interfaz. -->
<html lang="en" class="dark h-full" style="color-scheme: dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#09090b" />
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<div class="h-full" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
